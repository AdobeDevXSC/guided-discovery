application:
  web: web-src
  runtimeManifest:
    database:
      auto-provision: true
      region: amer
    packages:
      marketingprototype:
        license: Apache-2.0
        actions:
          items:
            function: actions/items/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations:
              require-adobe-auth: false
              final: true
              include-ims-credentials: true
          assessments:
            function: actions/assessments/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations:
              web-custom-options: true
              require-adobe-auth: false
              final: true
              include-ims-credentials: true
          assessments-admin:
            function: actions/assessments-admin/index.js
            web: 'yes'
            runtime: nodejs:22
            # require-adobe-auth wraps this action in a validator sequence that does not pass through
            # include-ims-credentials, so the database credentials are supplied explicitly from .env.
            inputs:
              clientId: $ADMIN_IMS_CLIENT_ID
              clientSecret: $ADMIN_IMS_CLIENT_SECRET
              orgId: $ADMIN_IMS_ORG_ID
              scopes: $ADMIN_IMS_SCOPES
            annotations:
              require-adobe-auth: true
              final: true
