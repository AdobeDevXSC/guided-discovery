application:
  web: web-src
  runtimeManifest:
    database:
      auto-provision: true
      region: amer
    packages:
      marketingprototype:
        license: Apache-2.0
        actions:
          items:
            function: actions/items/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations:
              require-adobe-auth: false
              final: true
              include-ims-credentials: true
          assessments:
            function: actions/assessments/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations:
              web-custom-options: true
              require-adobe-auth: false
              final: true
              include-ims-credentials: true
          assessments-admin:
            function: actions/assessments-admin/index.js
            web: 'yes'
            runtime: nodejs:22
            # require-adobe-auth wraps this action in a validator sequence that does not pass through
            # include-ims-credentials, so the database credentials are supplied explicitly from .env.
            inputs:
              clientId: $ADMIN_IMS_CLIENT_ID
              clientSecret: $ADMIN_IMS_CLIENT_SECRET
              orgId: $ADMIN_IMS_ORG_ID
              scopes: $ADMIN_IMS_SCOPES
              # encrypts the AI API key saved on the Settings page; the private key is not given to
              # this action (see actions/lib/settings.js)
              aiKeyPublic: $AI_KEY_PUBLIC
            annotations:
              require-adobe-auth: true
              final: true
          guided-discovery:
            function: actions/guided-discovery/index.js
            web: 'yes'
            runtime: nodejs:22
            # include-ims-credentials is not applied to this action by the platform (deployed with
            # no __ims_oauth_s2s), so the workspace OAuth S2S credentials are passed explicitly.
            inputs:
              clientId: $ADMIN_IMS_CLIENT_ID
              clientSecret: $ADMIN_IMS_CLIENT_SECRET
              orgId: $ADMIN_IMS_ORG_ID
              scopes: $ADMIN_IMS_SCOPES
            annotations:
              web-custom-options: true
              require-adobe-auth: false
              final: true
